[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-election-lab"
version = "0.1.0"
description = "A reproducible audit of election evidence and Jev forecasts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
bulk = ["pyarrow>=19"]

[project.scripts]
research = "jev_elections.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/jev_elections"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
